<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Olympic Compute Group — Battle Point Campus">
  <title>Olympic Compute Group — Battle Point Campus</title>
  <desc>Social share card. Dark evergreen gradient background with subtle stylized Olympic mountain silhouette and centered title lockup.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a14"/>
      <stop offset="50%" stop-color="#1a2a22"/>
      <stop offset="100%" stop-color="#2a4a3a"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5a45" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1a2a22" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- distant mountain ridges for depth -->
  <path d="M0 380 L120 320 L200 350 L320 280 L420 320 L520 250 L640 300 L760 240 L880 290 L1000 230 L1100 280 L1200 250 L1200 630 L0 630 Z"
        fill="url(#ridge)"/>
  <path d="M0 440 L100 400 L220 420 L320 380 L460 410 L580 360 L720 400 L840 350 L960 390 L1080 340 L1200 370 L1200 630 L0 630 Z"
        fill="#3a5a45" fill-opacity="0.18"/>

  <!-- vignette bottom -->
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- top-left brand lockup -->
  <g transform="translate(64 56)" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <!-- small mountain mark -->
    <g>
      <path d="M0 28 L8 18 L13 22 L21 10 L26 16 L33 4 L40 14 L46 0 L54 22 L54 28 Z" fill="#f5f1ea"/>
    </g>
    <text x="68" y="22" font-size="20" font-weight="600" fill="#f5f1ea" letter-spacing="-0.01em">Olympic Compute Group</text>
  </g>

  <!-- title block -->
  <g transform="translate(64 380)" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="0" y="0" font-size="22" font-weight="500" fill="#f5f1ea" fill-opacity="0.75" letter-spacing="0.18em">NOW UNDER ENVIRONMENTAL REVIEW</text>
    <text x="0" y="84" font-size="76" font-weight="600" fill="#ffffff" letter-spacing="-0.02em">Battle Point Campus</text>
    <text x="0" y="134" font-size="30" font-weight="400" fill="#dcd6c4" letter-spacing="0.005em">Bainbridge Island, Washington</text>
    <text x="0" y="190" font-size="22" font-weight="400" fill="#a8b2a8" letter-spacing="0.01em">A new home for the Pacific Northwest&apos;s AI future.</text>
  </g>

  <!-- thin accent rule -->
  <rect x="64" y="568" width="60" height="3" fill="#7ea0a0"/>
  <text x="140" y="582" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#a8b2a8" letter-spacing="0.14em">OLYMPIC-COMPUTE.VERCEL.APP</text>
</svg>
