<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1066" width="1600" height="1066" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Battle Point Campus Master Plan — Olympic Compute Group">
  <title>Battle Point Campus — Master Plan, Olympic Compute Group</title>
  <desc>Top-down architectural master plan showing Phase 1 building, Phase 2 expansion, cooling annex, substation, parking grid, perimeter security fence, and preserved forest buffer.</desc>

  <!-- background paper -->
  <rect width="1600" height="1066" fill="#f5f1ea"/>

  <!-- subtle grid -->
  <g stroke="#e0d9cc" stroke-width="1" opacity="0.6">
    <path d="M0 100 H1600 M0 200 H1600 M0 300 H1600 M0 400 H1600 M0 500 H1600 M0 600 H1600 M0 700 H1600 M0 800 H1600 M0 900 H1600 M0 1000 H1600"/>
    <path d="M100 0 V1066 M200 0 V1066 M300 0 V1066 M400 0 V1066 M500 0 V1066 M600 0 V1066 M700 0 V1066 M800 0 V1066 M900 0 V1066 M1000 0 V1066 M1100 0 V1066 M1200 0 V1066 M1300 0 V1066 M1400 0 V1066 M1500 0 V1066"/>
  </g>

  <!-- forest buffer (preserved greenway) -->
  <path d="M80 80 L1520 80 L1520 986 L80 986 Z M180 200 L1420 200 L1420 866 L180 866 Z"
        fill="#3a5a45" fill-opacity="0.22" fill-rule="evenodd" stroke="#3a5a45" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="100" y="115" font-size="14" fill="#3a5a45" letter-spacing="0.08em">FOREST BUFFER (PRESERVED)</text>

  <!-- access drive -->
  <path d="M1520 540 Q 1320 540 1240 560 L 1100 600" fill="none" stroke="#8a7e6a" stroke-width="14" stroke-linecap="round"/>
  <path d="M1520 540 Q 1320 540 1240 560 L 1100 600" fill="none" stroke="#d8cdb6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1260" y="525" font-size="13" fill="#5a4a32" letter-spacing="0.06em">ACCESS — NE BATTLE POINT DR</text>

  <!-- perimeter security fence (inner ring) -->
  <rect x="200" y="180" width="1200" height="720" fill="none" stroke="#5a4a32" stroke-width="1" stroke-dasharray="2 6"/>
  <text x="200" y="172" font-size="10" fill="#5a4a32" letter-spacing="0.10em">SECURITY PERIMETER (8' CHAIN-LINK / RAZOR)</text>

  <!-- cooling annex (north of building) -->
  <rect x="320" y="220" width="220" height="80" fill="#7ea0a0" stroke="#1f3a3a" stroke-width="1.5"/>
  <g fill="none" stroke="#1f3a3a" stroke-width="1" opacity="0.6">
    <path d="M340 240 H520 M340 260 H520 M340 280 H520"/>
  </g>
  <text x="332" y="248" font-size="14" font-weight="600" fill="#0e1f1f" letter-spacing="0.04em">COOLING ANNEX</text>
  <text x="332" y="266" font-size="11" fill="#0e1f1f" letter-spacing="0.06em">CLOSED-LOOP SEAWATER LOOP</text>

  <!-- phase 1 building -->
  <rect x="240" y="320" width="640" height="420" fill="#bcc2c2" stroke="#3a3f3f" stroke-width="1.5"/>
  <!-- rooftop mechanical units schematic -->
  <g fill="#a8aeae" stroke="#3a3f3f" stroke-width="0.75">
    <rect x="280" y="360" width="60" height="34"/>
    <rect x="360" y="360" width="60" height="34"/>
    <rect x="440" y="360" width="60" height="34"/>
    <rect x="520" y="360" width="60" height="34"/>
    <rect x="600" y="360" width="60" height="34"/>
    <rect x="680" y="360" width="60" height="34"/>
    <rect x="760" y="360" width="60" height="34"/>
    <!-- mechanical penthouse spine -->
    <rect x="280" y="440" width="560" height="60" fill="#9aa0a0"/>
    <rect x="280" y="560" width="60" height="34"/>
    <rect x="360" y="560" width="60" height="34"/>
    <rect x="440" y="560" width="60" height="34"/>
    <rect x="520" y="560" width="60" height="34"/>
    <rect x="600" y="560" width="60" height="34"/>
    <rect x="680" y="560" width="60" height="34"/>
    <rect x="760" y="560" width="60" height="34"/>
    <rect x="280" y="640" width="60" height="34"/>
    <rect x="360" y="640" width="60" height="34"/>
    <rect x="440" y="640" width="60" height="34"/>
    <rect x="520" y="640" width="60" height="34"/>
    <rect x="600" y="640" width="60" height="34"/>
    <rect x="680" y="640" width="60" height="34"/>
    <rect x="760" y="640" width="60" height="34"/>
  </g>
  <text x="260" y="350" font-size="16" font-weight="600" fill="#1f2a26" letter-spacing="0.04em">PHASE 1 — 412,000 SF</text>
  <text x="260" y="720" font-size="11" fill="#3a3f3f" letter-spacing="0.06em">SINGLE-STORY HYPERSCALE COMPUTE HALL</text>

  <!-- phase 2 (proposed) -->
  <rect x="900" y="320" width="320" height="420" fill="#d4d8d6" stroke="#3a3f3f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g fill="#c4c8c6" stroke="#3a3f3f" stroke-width="0.5" opacity="0.7">
    <rect x="930" y="380" width="60" height="34"/>
    <rect x="1010" y="380" width="60" height="34"/>
    <rect x="1090" y="380" width="60" height="34"/>
    <rect x="1170" y="380" width="40" height="34"/>
    <rect x="930" y="540" width="60" height="34"/>
    <rect x="1010" y="540" width="60" height="34"/>
    <rect x="1090" y="540" width="60" height="34"/>
    <rect x="1170" y="540" width="40" height="34"/>
  </g>
  <text x="918" y="350" font-size="15" font-weight="600" fill="#1f2a26" letter-spacing="0.04em">PHASE 2 (PROPOSED)</text>
  <text x="918" y="368" font-size="11" fill="#3a3f3f" letter-spacing="0.06em">~280,000 SF EXPANSION</text>

  <!-- substation -->
  <g>
    <rect x="320" y="780" width="260" height="90" fill="#a8a39a" stroke="#3a3f3f" stroke-width="1.5"/>
    <!-- transformer schematic -->
    <circle cx="380" cy="825" r="14" fill="none" stroke="#3a3f3f" stroke-width="1.5"/>
    <circle cx="430" cy="825" r="14" fill="none" stroke="#3a3f3f" stroke-width="1.5"/>
    <circle cx="490" cy="825" r="14" fill="none" stroke="#3a3f3f" stroke-width="1.5"/>
    <circle cx="540" cy="825" r="14" fill="none" stroke="#3a3f3f" stroke-width="1.5"/>
    <!-- bus bars -->
    <path d="M370 845 H550" stroke="#3a3f3f" stroke-width="1"/>
    <text x="332" y="800" font-size="13" font-weight="600" fill="#1f2a26" letter-spacing="0.04em">SUBSTATION — 230kV</text>
  </g>

  <!-- parking grid (~412 stalls) -->
  <rect x="900" y="780" width="320" height="90" fill="#eae3d3" stroke="#5a5f5f" stroke-width="1"/>
  <g stroke="#7a7f7f" stroke-width="0.6">
    <path d="M900 793 H1220 M900 806 H1220 M900 819 H1220 M900 832 H1220 M900 845 H1220 M900 858 H1220"/>
  </g>
  <g stroke="#7a7f7f" stroke-width="0.4" opacity="0.7">
    <path d="M906 780 V870 M918 780 V870 M930 780 V870 M942 780 V870 M954 780 V870 M966 780 V870 M978 780 V870 M990 780 V870 M1002 780 V870 M1014 780 V870 M1026 780 V870 M1038 780 V870 M1050 780 V870 M1062 780 V870 M1074 780 V870 M1086 780 V870 M1098 780 V870 M1110 780 V870 M1122 780 V870 M1134 780 V870 M1146 780 V870 M1158 780 V870 M1170 780 V870 M1182 780 V870 M1194 780 V870 M1206 780 V870"/>
  </g>
  <text x="912" y="772" font-size="13" font-weight="600" fill="#1f2a26" letter-spacing="0.04em">PARKING — 412 STALLS</text>

  <!-- compass rose -->
  <g transform="translate(1440 120)">
    <circle r="36" fill="#f5f1ea" stroke="#1f2a26" stroke-width="1.25"/>
    <path d="M0 -28 L8 12 L0 4 L-8 12 Z" fill="#1f2a26"/>
    <text x="0" y="-44" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a26">N</text>
  </g>

  <!-- scale bar -->
  <g transform="translate(1240 970)">
    <rect x="0" y="0" width="80" height="10" fill="#1f2a26"/>
    <rect x="80" y="0" width="80" height="10" fill="#f5f1ea" stroke="#1f2a26" stroke-width="1"/>
    <rect x="160" y="0" width="80" height="10" fill="#1f2a26"/>
    <text x="0" y="32" font-size="11" fill="#1f2a26">0</text>
    <text x="74" y="32" font-size="11" fill="#1f2a26">100</text>
    <text x="150" y="32" font-size="11" fill="#1f2a26">200 FT</text>
  </g>

  <!-- legend -->
  <g transform="translate(640 920)" font-size="11" fill="#1f2a26">
    <rect x="0" y="0" width="540" height="120" fill="#f5f1ea" stroke="#1f2a26" stroke-width="1"/>
    <text x="14" y="20" font-size="12" font-weight="700" letter-spacing="0.10em">LEGEND</text>
    <g transform="translate(14 32)">
      <rect x="0" y="0" width="16" height="12" fill="#bcc2c2" stroke="#3a3f3f" stroke-width="0.75"/>
      <text x="24" y="10">PHASE 1 BUILDING</text>
    </g>
    <g transform="translate(14 50)">
      <rect x="0" y="0" width="16" height="12" fill="#d4d8d6" stroke="#3a3f3f" stroke-width="0.75" stroke-dasharray="3 2"/>
      <text x="24" y="10">PHASE 2 (PROPOSED)</text>
    </g>
    <g transform="translate(14 68)">
      <rect x="0" y="0" width="16" height="12" fill="#7ea0a0" stroke="#1f3a3a" stroke-width="0.75"/>
      <text x="24" y="10">COOLING ANNEX</text>
    </g>
    <g transform="translate(14 86)">
      <rect x="0" y="0" width="16" height="12" fill="#a8a39a" stroke="#3a3f3f" stroke-width="0.75"/>
      <text x="24" y="10">SUBSTATION (230kV)</text>
    </g>
    <g transform="translate(220 32)">
      <rect x="0" y="0" width="16" height="12" fill="#3a5a45" fill-opacity="0.22" stroke="#3a5a45" stroke-width="0.75" stroke-dasharray="3 2"/>
      <text x="24" y="10">FOREST BUFFER</text>
    </g>
    <g transform="translate(220 50)">
      <rect x="0" y="0" width="16" height="12" fill="#eae3d3" stroke="#5a5f5f" stroke-width="0.75"/>
      <text x="24" y="10">PARKING (412 STALLS)</text>
    </g>
    <g transform="translate(220 68)">
      <line x1="0" y1="6" x2="16" y2="6" stroke="#5a4a32" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="24" y="10">SECURITY PERIMETER</text>
    </g>
    <g transform="translate(220 86)">
      <line x1="0" y1="6" x2="16" y2="6" stroke="#8a7e6a" stroke-width="6" stroke-linecap="round"/>
      <text x="24" y="10">ACCESS DRIVE</text>
    </g>
  </g>

  <!-- title block -->
  <g transform="translate(80 920)">
    <rect x="0" y="0" width="520" height="120" fill="#f5f1ea" stroke="#1f2a26" stroke-width="1.25"/>
    <rect x="0" y="0" width="520" height="28" fill="#2a4a3a"/>
    <text x="14" y="20" font-size="13" font-weight="700" fill="#f5f1ea" letter-spacing="0.18em">OLYMPIC COMPUTE GROUP</text>
    <text x="14" y="56" font-size="20" font-weight="600" fill="#1f2a26" letter-spacing="0.02em">BATTLE POINT CAMPUS</text>
    <text x="14" y="78" font-size="12" fill="#3a3f3f" letter-spacing="0.06em">MASTER PLAN — REV A — JUNE 2026</text>
    <text x="14" y="98" font-size="11" fill="#5a5f5f" letter-spacing="0.06em">BAINBRIDGE ISLAND, WASHINGTON</text>
    <text x="14" y="114" font-size="10" fill="#7a7f7f" letter-spacing="0.06em">SHEET A1.00 — FOR ENVIRONMENTAL REVIEW</text>
  </g>
</svg>
