<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="Olympic Compute Group">
  <title>Olympic Compute Group</title>

  <!-- Mark: 4-peak Olympic mountain silhouette with embedded CPU-die motif -->
  <g transform="translate(8 8)">
    <!-- closed mountain silhouette, evergreen -->
    <path d="M0 46 L10 30 L16 38 L26 18 L32 28 L40 12 L48 24 L56 8 L64 30 L64 46 Z"
          fill="#2a4a3a" stroke="none"/>
    <!-- subtle inner peak highlight to give dimension -->
    <path d="M26 18 L32 28 L40 12 L48 24 L56 8 L64 30 L64 30 L40 12 Z"
          fill="#1f3a2c" stroke="none" opacity="0.55"/>
    <!-- CPU-die motif tucked into the largest (tallest) peak around the (56,8) summit -->
    <g transform="translate(50 18)" fill="#f5f1ea" stroke="none">
      <!-- die body -->
      <rect x="0" y="0" width="10" height="10" rx="0.5"/>
      <!-- center die inset -->
      <rect x="2.5" y="2.5" width="5" height="5" fill="#2a4a3a"/>
      <!-- pin stubs (top/bottom/left/right) — visible only at large sizes, kept tiny so 16px favicon still reads as a mountain -->
      <rect x="1" y="-1.4" width="0.9" height="1.4"/>
      <rect x="3" y="-1.4" width="0.9" height="1.4"/>
      <rect x="5" y="-1.4" width="0.9" height="1.4"/>
      <rect x="7" y="-1.4" width="0.9" height="1.4"/>
      <rect x="1" y="10" width="0.9" height="1.4"/>
      <rect x="3" y="10" width="0.9" height="1.4"/>
      <rect x="5" y="10" width="0.9" height="1.4"/>
      <rect x="7" y="10" width="0.9" height="1.4"/>
      <rect x="-1.4" y="1" width="1.4" height="0.9"/>
      <rect x="-1.4" y="3" width="1.4" height="0.9"/>
      <rect x="-1.4" y="5" width="1.4" height="0.9"/>
      <rect x="-1.4" y="7" width="1.4" height="0.9"/>
      <rect x="10" y="1" width="1.4" height="0.9"/>
      <rect x="10" y="3" width="1.4" height="0.9"/>
      <rect x="10" y="5" width="1.4" height="0.9"/>
      <rect x="10" y="7" width="1.4" height="0.9"/>
    </g>
    <!-- baseline -->
    <path d="M-2 46 L66 46" stroke="#2a4a3a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" fill="#2a4a3a">
    <text x="92" y="36" font-size="20" font-weight="600" letter-spacing="-0.01em">Olympic Compute</text>
    <text x="92" y="54" font-size="11" font-weight="500" letter-spacing="0.22em">G R O U P</text>
  </g>
</svg>
